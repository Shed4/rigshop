    <title>riglineshop</title>

<body>
    
<div class="p-6 bg-gray-100 min-h-screen">

<h1 class="text-3xl font-bold">
Rlgshop Admin</h1>

<div class="bg-white p-5 rounded-xl mt-5">

<h2 class="font-bold text-xl">Add Product</h2>

<input id="name"class="border p-3 w-full mt-3"placeholder="Product name">

<input id="price" class="border p-3 w-full mt-3" placeholder="Price">

<input id="image" class="border p-3 w-full mt-3" placeholder="Image URL">

<textarea id="description" class="border p-3 w-full mt-3" placeholder="Description"></textarea>

<button id="upload" class="bg-black text-white p-3 rounded mt-3 hover:translate-y-2"> Upload Product</button></div>

<!-- Products -->

<div class="bg-white p-5 rounded-xl mt-5">
<h2 class="text-xl font-bold">Products</h2>
<div id="products"></div>

</div>




<!-- Users -->

<div class="bg-white p-5 rounded-xl mt-5">

<h2 class="text-xl font-bold">Users</h2>
<div id="users"></div>

</div>

</div>
