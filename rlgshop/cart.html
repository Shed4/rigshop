<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Basic Icons -->
   <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
   <!-- Filled Icons -->
   <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
   <!-- Brand Icons -->
   <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bebas+Neue&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Orbitron:wght@400..900&family=Playwrite+NZ+Guides&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="./src/style.css">
    <title>riglineshop</title>
</head>
<body>
    <header class=" flex flex-col sm:flex-row sm:justify-between pr-40 pl-5 py-4 mt-4">
      <div><img src="./public/logo Ridgline.png" width="40"></div>
      <ul class="flex justify-evenly items-center gap-12">
        <li class="font-semibold hover:border-b-2"><a href="shop">Shop</a></li>
        <li class="font-semibold hover:border-b-2 "><a href="contact">Contact</a></li>
        <li class="font-semibold hover:border-b-2 "><a href="#about">About</a></li>
        <button class=" text-black  px-4 py-2 text-center font-medium hover:bg-black hover:text-white rounded-[5px] "> <a href="register.html" target="_blank">Signup</a></button>
        <button class=" text-black px-4 py-2 text-center font-medium  hover:bg-black hover:text-white rounded-[5px] ">login</button>
       <!--
        <div class="relative"> 
        <i class="bx bx-cart text-4xl p-0  translate-x-2" id=" ">cart</i> 
          <div class=" absolute top-0.5 -right-0.5 h-2 w-2 rounded-full bg-red-900 "></div>
       </div> -->
      </ul>
    </header>
    <main>
        <div id="cart-items" class="flex flex-wrap justify-center gap-8 mt-6">
        </div>
        <div class="flex justify-center mt-8">
        <div class=" h-30 w-250 bg-black/20 flex justify-around rounded-2xl items-center ">
        <div id="total-price"> 
        </div>
        <div>
        <button class="text-black  px-4 py-2 text-center font-medium bg-black text-white rounded-[5px] translate-x-2 hover:text-red-300/90" id="check-out">Checkout</button>
        </div>
        </div>

        
        <script>
           const cartContainer =document.querySelector("#cart-items");
         // const currentUser =JSON.parse(localStorage.getItem("currentUser"));
          const totalPrice =document.querySelector("#total-price");
         
          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          console.log(cart);
          let total=0;
       if(cart.length > 0){ 
           cartContainer.innerHTML ="";
        cart.forEach((item) =>{
    cartContainer.innerHTML +=`<div class=" w-90 inset-0  bg-black/10 rounded-[30px] flex justify-center flex-col items-center p-6"><img src="${item.image}" width="200">
    <h2 class="font-bold mt-4">${item.productName}</h2>
    <h2 class="font-semibold mt-2 text-red-700">${item.price}</h2>
    <button class="mt-3 hover:text-red-800 deleteBtn" data-id="${item.id}">Delete</button>
    </div>` } ); 
  
   const total = cart.reduce((sum,item) =>{
     return sum +
     Number(item.price);

   },0);
   totalPrice.innerHTML=`<h2 class="text-[1.2rem] font-bold text-black">Amount: $${total}</h2>`;
  
  } else{
    alert("Your cart is empty");
    totalPrice.textContent = "Total: $0";
  
  }
  //User verification
    const checkOutBtn=document.querySelector("#check-out");
  
    checkOutBtn.addEventListener("click",()=>{
      const users =JSON.parse(localStorage.getItem("users")) || [];
      const currentUser =JSON.parse(localStorage.getItem("currentUser")) || null;
      const cart =JSON.parse(localStorage.getItem("cart"))|| [];
      
      // check empty cart
      if(!cart || cart.length ==0){
        alert("You have an empty cart");
        return;
      }

      //User already loggedin
      if(currentUser !==null){
        window.location.href="checkOutBtn";
        return;
      }

      //user has account but not logged in

      if(users.length >0){
        alert("Please login before checkout");
        window.location.href="login.html";
        return;
      }

      // user has no account
      alert("Please create an account before checkout");
      window.location.href ="register.html";
    });
    

     const deleteBtn=document.querySelectorAll(".deleteBtn");
      function deleteitem(){
        const id=Number(this.dataset.id);
        
        let cart=JSON.parse(localStorage.getItem("cart")) || [];

        cart=cart.filter(item => item.id !== id);
        localStorage.setItem("cart",JSON.stringify(cart));
        this.parentElement.remove();
      }
      deleteBtn.forEach((button)=>{
        button.addEventListener("click",deleteitem);
      });
        </script>
    </main>
</body>
